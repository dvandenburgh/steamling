# 64 KB transparent huge pages for every process. arm64 maps a 64 KB block of memory with one
# contiguous TLB entry where it can (CONFIG_ARM64_CONTPTE), so big heaps take far fewer TLB misses,
# while the base page stays 4 KB, which FEX needs. Allocation falls back to 4 KB pages without
# compacting memory (defrag stays at madvise), so a fragmented system pays nothing. The 2 MB size
# keeps the kernel's default of madvise only. docs/benchmarking.md shows how to A/B it.
w- /sys/kernel/mm/transparent_hugepage/hugepages-64kB/enabled - - - - always
