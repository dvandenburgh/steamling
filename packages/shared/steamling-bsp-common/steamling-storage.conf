# Steamling's defaults for the handheld's own storage (UFS and the microSD card). Change them with
# `sudo steamling-storage scheduler <name>` and `sudo steamling-storage readahead <KB>`, which
# write /etc/steamling/storage.conf; `sudo steamling-storage reset` comes back here.
#
# mq-deadline serves reads before writes that can wait, so a game loading assets while Steam
# downloads isn't stuck behind the download's writes. The UFS otherwise gets none (first come,
# first served), the microSD card already gets mq-deadline. ADIOS (CachyOS's adaptive deadline
# scheduler) is built in to try against it: `sudo steamling-storage scheduler adios`.
SCHEDULER=mq-deadline
# 256 KB instead of the kernel's 128 KB, as CachyOS's kernel does: games read their assets in big
# sequential runs, so fetching further ahead means fewer, larger reads from the card.
READAHEAD_KB=256
