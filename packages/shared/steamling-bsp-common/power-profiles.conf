# Factory power profiles for steamling-perfd. Override per key in /etc/steamling/power-profiles.conf;
# profile ids are what Steam stores per game and match steamos-manager's native profile names,
# so never rename one.
# Ratios are fractions of the top OPP: gpu_min rounds up to an OPP, gpu_max and cpu_max down.
# cpu_max only applies where the SoC has no [underclock.<SOC>.<level>] table. Those tables and
# per-SoC [profile.<id>.<SOC>] overlays are hardware data: the family BSP ships them in
# /usr/share/steamling/power-profiles.d/.

[general]
default_profile = Performance
gpu_manual_min = 0.45
# While on a charger or a powered dock, a slower profile runs with this one's clocks instead; the
# profile picked in Steam is kept and comes back on battery. Empty turns it off.
charger_profile = Performance

[profile.Performance]
label = Performance
underclock = none
cpu_max = 1.0
gpu_min = 0.0
gpu_max = 1.0

[profile.Balanced]
label = Balanced
underclock = small
cpu_max = 0.85
gpu_min = 0.0
gpu_max = 1.0

[profile.Powersave]
label = Powersave
underclock = large
cpu_max = 0.70
gpu_min = 0.0
gpu_max = 0.75
