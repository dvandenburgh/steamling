name: Bug report
description: Something is broken or misbehaving on your device
labels: ["triage"]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: For an untested port, name the exact handheld in "What happened" below.
      options:
        - Retroid Pocket 6
        - Retroid Pocket 6 TOP-DPAD
        - Another Snapdragon 8 Gen 2 handheld (untested port)
        - A Snapdragon 865 handheld (untested port)
        - A Snapdragon 8 Gen 3 handheld (untested port)
        - A Snapdragon 8 Elite handheld (untested port)
        - Other / not device-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Steamling version
      description: >
        Steam's Settings → System shows it, as does the bottom of Governor's System tab.
        If you know the affected package, its version helps too
        (`pacman -Q steamling-steam`, `pacman -Qs linux-steamling`, ...).
      placeholder: "0.1.1, or the output of pacman -Q <package>"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Where it happens
      options:
        - Gaming mode (Steam)
        - Desktop mode (Plasma)
        - Both
        - Boot / before any session
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or extra context
      description: >
        Anything else useful - journalctl output, screenshots, whether it worked
        on a previous version.
      render: text
    validations:
      required: false
