# steamling build configuration
#
# Central settings sourced by every script in scripts/. Override any value by
# exporting it in your shell before invoking make, e.g.:
#
#   export DISTRIBUTION_DIR=/path/to/distribution
#   make build
#
# This file must stay POSIX-sh compatible (it is sourced, not executed).

# ---------------------------------------------------------------------------
# Image target — a key into devices/<name>/profile.conf, which lib.sh sources
# right after this file. What differs per family (SoC, boot style, kernel cmdline)
# lives in the profile; this file holds target-NEUTRAL settings, including the
# profile defaults below that every family shares.
#   make build DEVICE=sm8550   (or export DEVICE before invoking make)
# DEVICE names an IMAGE TARGET, a SoC family: this tree builds sm8550 for the Retroid Pocket 6,
# with the board selected at runtime by devicetree model (the BSP's boards/ + the device.conf
# rendered from boards/models).
# ---------------------------------------------------------------------------
: "${DEVICE:=sm8550}"         # a SoC family, not a board (members: the BSP's boards/)

# Profile defaults every family shares (the ordering rule is in scripts/lib.sh).
: "${DEVICE_HOSTNAME:=steamling}"     # kernel CONFIG_DEFAULT_HOSTNAME only; the image sets the real one
# qcom-abl's ABL scans FAT partitions for boot files, never the label.
: "${SD_FAT_LABEL:=STEAMLING}"
: "${SD_BOOT_PARTNAME:=system}"     # GPT name of the SD boot FAT
: "${ROOT_LABEL:=STEAMLING_ROOT}"     # GPT name and btrfs label of the root partition

# ---------------------------------------------------------------------------
# Layout (absolute paths derived from STEAMLING_ROOT, set by lib.sh)
# NB: KERNEL_DIR is derived in lib.sh as kernel/${SOC} once the profile has
# set the SoC.
# ---------------------------------------------------------------------------
: "${BUILD_DIR:=${STEAMLING_ROOT}/build}"
: "${ROOTFS_DIR:=${BUILD_DIR}/rootfs}"
# NB: IMAGE_DIR and KERNEL_BUILD_DIR are derived in lib.sh as build/image/${SOC}
# and build/kernel/${SOC} once the profile has set the SoC (like KERNEL_DIR).
: "${VENDOR_DIR:=${STEAMLING_ROOT}/vendor}"
: "${CONFIG_DIR:=${STEAMLING_ROOT}/config}"
: "${PACKAGES_DIR:=${STEAMLING_ROOT}/packages}"
: "${CACHE_DIR:=${BUILD_DIR}/cache}"
: "${PKG_CACHE_DIR:=${CACHE_DIR}/pacman-pkg}"   # one pacman package cache for every chroot
# ccache for the package builds (the kernel's is ${CACHE_DIR}/ccache): on, or off to compile
# everything from scratch. 20G holds mesa, Cemu, Dolphin, FEX and the rest for every SoC.
: "${STEAMLING_CCACHE:=on}"
: "${STEAMLING_CCACHE_SIZE:=20G}"
: "${PKG_CCACHE_DIR:=${CACHE_DIR}/ccache-pkg}"

# ---------------------------------------------------------------------------
# Arch Linux ARM base rootfs
# Steamling bootstraps from ALARM's own rolling "latest" tarball, straight from
# archlinuxarm.org. It is only the seed: with a frozen base pinned below, the
# rootfs and the build chroot are synced onto that base right after extraction
# (pacman -Syuu, downgrades allowed), so a tarball newer or older than the base
# cannot leave a mix of the two. Each build compares the cached copy with ALARM's
# published .md5 and downloads again when "latest" has moved.
# For a hermetic/reproducible build set STEAMLING_ALARM_SHA256 (and a dated
# STEAMLING_ALARM_TARBALL_URL) to the exact tarball you intend to pin.
# ---------------------------------------------------------------------------
: "${ALARM_MIRROR:=http://os.archlinuxarm.org/os}"
: "${ALARM_TARBALL:=ArchLinuxARM-aarch64-latest.tar.gz}"
: "${STEAMLING_ALARM_SHA256:=}"
# Full tarball URL, overridable independently of the mirror: a pinned snapshot
# (make snapshot) repoints this at a hosted copy of the dated tarball, so
# rebuilding an old release doesn't depend on ALARM still serving that file.
: "${STEAMLING_ALARM_TARBALL_URL:=${ALARM_MIRROR}/${ALARM_TARBALL}}"

# ---------------------------------------------------------------------------
# Kernel source pins live per-SoC in kernel/<soc>/kernel.conf (sourced by
# lib.sh after the device profile). The cmdline is a device fact and lives in
# devices/<name>/profile.conf.
# ---------------------------------------------------------------------------

# mkbootimg (Google): builds the qcom-abl Android boot image.
: "${MKBOOTIMG_URL:=https://android.googlesource.com/platform/system/tools/mkbootimg}"
: "${MKBOOTIMG_COMMIT:=d2bb0af5ba6d3198a3e99529c97eda1be0b5a093}"

# Parallelism for the kernel compile
: "${JOBS:=}"

# ---------------------------------------------------------------------------
# SD boot-test image (build-sd-image.sh) — device-neutral knobs. The partition
# names/labels the device's bootloader expects come from the device profile.
# ---------------------------------------------------------------------------
# FIXED, well-known partition GUIDs for every steamling SD image. An internal
# install shares the SD's GPT names/labels (STEAMLING_ROOT), so name/label-based
# root= resolution races when both are present. Deterministic PARTUUIDs let the
# image fstab pin its own partitions unambiguously. Hex spells
# "steamln0..boot../root..". Caveat: don't dd the same image onto TWO media in
# one device (USB + SD): the GUIDs would collide.
: "${SD_BOOT_PARTUUID:=73746561-6d6c-6e30-626f-6f7400000001}"
: "${SD_ROOT_PARTUUID:=73746561-6d6c-6e30-726f-6f7400000002}"
: "${SD_BOOT_MIB:=256}"             # size of the FAT boot partition
: "${SD_SLACK_MIB:=1024}"           # free space added to the root partition beyond the rootfs
: "${SD_ROOT_PASSWORD:=root}"       # root (and deck) password baked into the test image (CHANGE for real use)
# SSH server, OFF by default (the password above is public — see build-sd-image.sh).
# For a dev image reachable from first boot:  ./build.sh --ssh  (or: make image SSH=1).
# SSH=1 is the short spelling and wins over SD_SSH; both take on/off, 1/0, yes/no, true/false,
# so `export SSH=1` in your shell turns it on for every build.
: "${SD_SSH:=off}"
# Optional Wi-Fi pre-seed: if set, the image auto-joins this network on boot so you
# can reach it over Wi-Fi (no USB cable; pair with --ssh). Pass at build time, e.g.:
#   ./build.sh --ssh --wifi 'MyNet' --wifi-psk 'secret' --wifi-country US
#   sudo SD_WIFI_SSID='MyNet' SD_WIFI_PSK='secret' make sd-image
: "${SD_WIFI_SSID:=}"
: "${SD_WIFI_PSK:=}"
# Wi-Fi regulatory country (2-letter ISO code, e.g. GB/US/DE). REQUIRED for 5 GHz:
# regulatory.db only provides the rules; the domain must be SET or the kernel stays on
# the restrictive world domain (5 GHz channels become no-IR -> can't associate).
: "${SD_WIFI_COUNTRY:=}"

# ---------------------------------------------------------------------------
# Published [steamling] pacman repo (incremental updates: device runs pacman -Syu
# instead of reflashing). Steamling doesn't host one yet, so it ships OFF: with
# STEAMLING_REPO_URL empty the image has no [steamling] stanza and updates mean a
# reflash. Point these at your own server when you have one.
#   STEAMLING_REPO_URL           BASE url; devices fetch from <base>/<soc>, e.g.
#                                https://repo.example.com/aarch64 -> .../aarch64/sm8550
#                                (or http://<vm-ip>:8000 for LAN testing). Per-SoC
#                                trees because tuned packages (mesa, gamescope, ...)
#                                share pkgnames across SoCs with different binaries.
#   STEAMLING_REPO_SIGLEVEL      pacman SigLevel for the stanza; use
#                                "Optional TrustAll" for unsigned LAN testing
#   STEAMLING_REPO_GPG_KEY       key id/email publish-repo.sh signs with (empty = unsigned)
#   STEAMLING_REPO_PUBKEY        path to the exported public key; baked into the image
#                                + lsigned so devices trust the repo out of the box
#                                (commit it under config/ once you make one)
#   STEAMLING_REPO_RCLONE_REMOTE rclone destination, e.g. r2:steamling/repo
# ---------------------------------------------------------------------------
: "${STEAMLING_REPO_URL:=}"
: "${STEAMLING_REPO_SIGLEVEL:=Required DatabaseOptional}"
: "${STEAMLING_REPO_GPG_KEY:=}"
: "${STEAMLING_REPO_PUBKEY:=}"
: "${STEAMLING_REPO_RCLONE_REMOTE:=r2:steamling/repo}"
# SD-image publishing (make publish-image): destination + public base URL for
# the printed download link, e.g. r2:steamling/images + https://dl.<domain>/images
: "${STEAMLING_IMAGE_RCLONE_REMOTE:=r2:steamling/images}"
: "${STEAMLING_IMAGE_URL:=}"

# ---------------------------------------------------------------------------
# Frozen ALARM package base ([pocknix-base]).
# STEAMLING_BASE_SNAPSHOT is the LABEL of the base we ship (created by `make
# snapshot`): it versions the steamling-base-lock package, stamps images, and
# names the tarball. Set: the rootfs AND the build chroot install only from
# [pocknix-base], so builds are reproducible and the chroot can never lag or
# lead devices. "live" (set it in config/local.conf or the environment): build
# straight from ALARM's own repos and its latest tarball, rolling and unrecorded.
# The URL is deliberately STABLE across snapshots — "frozen" means the base
# never moves on its own, not that it is immutable, so a release that moves it
# reaches devices through a plain -Syu with nothing to repoint. The outgoing
# base is rotated to <remote>-prev (the previous release stays rebuildable).
# One base serves both SoCs: it is plain aarch64; per-SoC tuning is [steamling].
# ---------------------------------------------------------------------------
: "${STEAMLING_BASE_SNAPSHOT:=20261023}"
# The frozen base is borrowed from the Pocknix project, which publishes it at
# pocknix.shuuri.net under the repo name [pocknix-base] (pacman needs our stanza to
# use that same name). It is plain Arch Linux ARM packages, signed by ALARM.
: "${STEAMLING_BASE_URL:=https://pocknix.shuuri.net/repo/base}"
# snapshot-base.sh (make snapshot): where the base publishes to, and which ALARM
# package mirror to harvest exact files from (downloads are sha256-verified
# against the sync dbs the build used, so any mirror is safe).
: "${STEAMLING_BASE_RCLONE_REMOTE:=${STEAMLING_REPO_RCLONE_REMOTE}/base}"
: "${STEAMLING_ALARM_PKG_MIRROR:=http://mirror.archlinuxarm.org/aarch64}"

# ---------------------------------------------------------------------------
# Source of the ROCKNIX kernel + device integration to vendor (make sync).
# make sync fetches the parts of the ROCKNIX distribution repo it reads into
# vendor/distribution, sparse and at ROCKNIX_COMMIT, so every checkout vendors
# the same files. A checkout of your own at ../distribution (or DISTRIBUTION_DIR)
# is used as it is instead: that is how kernel/<soc>/ moves to a newer ROCKNIX.
# The per-SoC device dir (ROCKNIX_DEVICE_DIR) is derived in lib.sh from
# ROCKNIX_SOC (set in kernel/<soc>/kernel.conf).
# ---------------------------------------------------------------------------
: "${ROCKNIX_URL:=https://github.com/ROCKNIX/distribution}"
: "${ROCKNIX_COMMIT:=075a7c303b92c4984aa72e6ce85d5d951c3490c6}"   # next, 2026-10-17
if [ -z "${DISTRIBUTION_DIR:-}" ]; then
  if [ -d "${STEAMLING_ROOT}/../distribution/projects/ROCKNIX" ]; then
    DISTRIBUTION_DIR="${STEAMLING_ROOT}/../distribution"
  else
    DISTRIBUTION_DIR="${VENDOR_DIR}/distribution"
  fi
fi
: "${ROCKNIX_PROJECT_DIR:=${DISTRIBUTION_DIR}/projects/ROCKNIX}"

# ---------------------------------------------------------------------------
# Cross-build / chroot helpers
# When building on an x86_64 host, package installation runs the aarch64 pacman
# under qemu-user-static via binfmt_misc. The build copies whichever qemu the binfmt handler
# names; this is the fallback when the handler names none.
# ---------------------------------------------------------------------------
: "${QEMU_AARCH64_STATIC:=/usr/bin/qemu-aarch64-static}"
