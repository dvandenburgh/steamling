# kernel/sm8550/kernel.conf — per-SoC kernel source pins + package release. POSIX sh, sourced by
# scripts/lib.sh after the device profile (which sets SOC and thereby selects
# this file). Bumping this SoC's kernel never touches another SoC's tree.
#
# Stock kernel.org source, pinned. The full kernel is this stock source + the
# patch stack under kernel/sm8550/patches/ (applied in numeric subdir order:
# 10-mainline -> 20-version -> 30-sm8550, then kernel/common/patches) + the config.
#
# `make sync` moves the patch stack, never this pin: bump it by hand when
# ROCKNIX's packages/linux/package.mk moves. 7.3.4 is ahead of ROCKNIX (still on 7.2.11): the
# stack was rebased onto it by hand, and sync-keep holds every ROCKNIX patch that changed or
# went upstream, so a full sync cannot put the 7.2 versions back.
: "${KERNEL_VERSION:=7.3.4}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
# The tarball's sha256; the build refuses a download that doesn't match. Empty it when
# KERNEL_VERSION moves and the build only warns until the new hash is pinned.
: "${KERNEL_SOURCE_SHA256:=b11b6df8295e8e991ff040b71aaa4994a8b55caa23b6b092907f195b5840fd1f}"

# The kernel package's pkgrel (packages/soc/linux-steamling reads it with KERNEL_VERSION as
# pkgver): bump it to repackage the same kernel, back to 1 when KERNEL_VERSION moves.
: "${KERNEL_PKGREL:=2}"
# Names this SoC's kernel shipped under before; the package provides, conflicts and replaces
# them so an install of the old name (an old image, a rolled-back snapshot) migrates.
: "${KERNEL_LEGACY_NAMES:=linux-steamling}"

# ROCKNIX's version patch dir (packages/linux/patches/<ver>/). Not derived from
# KERNEL_VERSION: ROCKNIX's dir name can lag the kernel version it patches (it does now, a
# minor release behind ours).
: "${ROCKNIX_VERSION_PATCH_DIR:=7.2}"

# The ROCKNIX device dir this tree is synced from (scripts/sync.sh):
# ${ROCKNIX_PROJECT_DIR}/devices/${ROCKNIX_SOC}. ROCKNIX names its device dirs
# in uppercase; our SOC key is lowercase (it names kernel/<soc>/ and
# vendor/rocknix-<soc>/).
: "${ROCKNIX_SOC:=SM8550}"
