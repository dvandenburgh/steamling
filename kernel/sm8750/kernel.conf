# kernel/sm8750/kernel.conf — SM8750 builds the shared Steamling tree (kernel/steamling/README.md).
# POSIX sh, sourced by scripts/lib.sh after the device profile. The source pin is repeated in each
# SoC on the tree (sm8250, sm8650, sm8750): bump them together.
: "${KERNEL_TREE:=steamling}"
: "${KERNEL_VERSION:=7.3.3}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
# The tarball's sha256; the build refuses a download that doesn't match. Empty it when
# KERNEL_VERSION moves and the build only warns until the new hash is pinned.
: "${KERNEL_SOURCE_SHA256:=79c66dde66cd96877fcde8f7d36aec946b1f423d2b97b5a7b1751b75c764f3d1}"

# The tree carries every board on it; this SoC's boot image ships only its own dtbs.
: "${KERNEL_DTB_PREFIXES:=sm8750- cq8725s-}"

# The kernel package's pkgrel (packages/soc/linux-steamling): back to 1 when KERNEL_VERSION moves.
: "${KERNEL_PKGREL:=3}"
