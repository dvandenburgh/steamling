# Use case configuration for Retroid Pocket 5, Flip2, Mini, and Mini V2.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		# Mixer state outlives PipeWire: clear a DP route left by a crash or restart while docked.
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	Include.wsamspke.File "/codecs/qcom-lpass/wsa-macro/SpeakerEnableSeq.conf"
	Include.wsamspkd.File "/codecs/qcom-lpass/wsa-macro/SpeakerDisableSeq.conf"
	Include.wsaspke.File "/codecs/wsa881x/SpeakerEnableSeq.conf"
	Include.wsaspkd.File "/codecs/wsa881x/SpeakerDisableSeq.conf"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

# DP borrows the speaker's MultiMedia2, not the free MultiMedia4: PipeWire's probe
# opens every PCM, and an unrouted DP PCM failing that open drops the whole HiFi profile.
SectionDevice."DisplayPort" {
	Comment "DisplayPort playback"

	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		CaptureChannels 2
		CaptureRate 48000
		JackControl "Mic Jack"
	}
}

If.flip2-mic {
	Condition {
		Type String
		Haystack "${sys:firmware/devicetree/base/model}"
		Needle "Retroid Pocket Flip2"
	}
	True {
		SectionDevice."Mic" {
			Comment "Internal Microphone"

			ConflictingDevice [
				"Headset"
			]

			EnableSequence [
				cset "name='DMIC4_MIXER Switch' 1"
				cset "name='DMIC3 Switch' 1"
				cset "name='TX DEC0 MUX' SWR_MIC"
				cset "name='TX SMIC MUX0' SWR_DMIC3"
				cset "name='TX_AIF1_CAP Mixer DEC0' 1"
				cset "name='TX_DEC0 Volume' 96"
			]

			DisableSequence [
				cset "name='TX_AIF1_CAP Mixer DEC0' 0"
				cset "name='TX SMIC MUX0' ZERO"
				cset "name='DMIC3 Switch' 0"
				cset "name='DMIC4_MIXER Switch' 0"
			]

			Value {
				CapturePriority 50
				CapturePCM "hw:${CardId},2"
			}
		}
	}
}
